server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Resolve the API container lazily (per-request) via Docker's embedded DNS instead of at
        # startup. Prevents nginx from hard-failing with "host not found in upstream" (and the UI
        # container exiting -> 502) whenever fixtag-api-dev is briefly down/restarting.
        resolver 127.0.0.11 valid=10s;
        set $fixtag_api http://fixtag-api-dev:5000;
        proxy_pass $fixtag_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Static asset files (JS/CSS/images) — cache aggressively
    # Must use regex to avoid catching React Router routes like /assets/inward
    location ~* ^/assets/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
