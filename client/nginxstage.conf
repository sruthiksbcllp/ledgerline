server {
    listen 80;
    server_name stage.fixtag.in *.stage.fixtag.in localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Extract subdomain from Host header (e.g. abc.stage.fixtag.in → abc)
    set $subdomain "";
    if ($host ~* "^([a-z0-9-]+)\.stage\.fixtag\.in$") {
        set $subdomain $1;
    }

    location /api/ {
        proxy_pass http://fixtag-api-stage:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Subdomain $subdomain;
        proxy_read_timeout 120s;
    }

    # Static asset files (JS/CSS/images) — cache aggressively
    # Must use regex to avoid catching React Router routes like /assets/inward
    location ~* ^/assets/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
